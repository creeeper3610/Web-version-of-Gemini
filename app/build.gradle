plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.geminiapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.geminiapp"
        minSdk 28 /* Android 9以降（フォアグラウンドサービス要件のため） */
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
